<div class="buttons">
  <button type="button" (click)="state.back()" [disabled]="state.loading()">חזור</button>
</div>

@if (state.page(); as page) {
  @if (page.message) {
    <p class="message">{{ page.message }}</p>
  } @else {
    <app-combination-list [items]="page.items" />
    <app-pager
      [currentPage]="state.currentPage()"
      [totalPages]="state.totalPages()"
      [disabled]="state.loading()"
      (pageChange)="state.goToPage($event)"
    />
  }
}
